<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心港 · 对话</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202020;font:15px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,textarea{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit;padding:9px 15px;border-radius:10px}button:hover{background:#eee}button:disabled{opacity:.35;cursor:default}main{max-width:800px;margin:auto;padding:0 24px}header{position:fixed;top:0;left:0;right:0;z-index:2;height:72px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;background:#ffffffed;border-bottom:1px solid #f2f2f2;backdrop-filter:blur(12px)}.brand{font-weight:600;font-size:19px;letter-spacing:1px}header small{font-size:11px;color:#999;margin-left:10px}header br{display:none}#clear{border:1px solid #e5e5e5;font-size:13px}.intro{text-align:center;padding:clamp(120px,24vh,230px) 0 45px}.intro>small{display:none}h1{font-size:30px;letter-spacing:-1px;font-weight:500;line-height:1.5;margin:0 0 12px}.intro p{font-size:14px;color:#999;margin:0 0 30px}.modes{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.modes button{border:1px solid #e6e6e6;border-radius:22px;font-size:13px;color:#777;padding:6px 16px}.modes button[aria-pressed=true]{color:#222;background:#f3f3f3;border-color:#d8d8d8}#messages{padding:100px 0 230px;display:none}body.chatting #messages{display:block}body.chatting .intro{display:none}.msg{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 32px;line-height:1.95}.user{background:#f2f2f2;border-radius:22px;padding:12px 20px;max-width:80%;width:fit-content;margin-left:auto}.assistant{padding:8px 4px}.label{font-size:11px;font-weight:600;color:#999;margin-bottom:9px}.user .label{display:none}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(800px,100%);padding:16px 24px 12px;background:linear-gradient(transparent,#fff 10%)}.composer>label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}textarea{display:block;width:100%;resize:none;min-height:112px;max-height:220px;border:1px solid #e8e8e8;border-radius:24px;background:#f7f7f7;padding:18px 20px 48px;color:#222;outline:none}textarea::placeholder{color:#aaa}textarea:focus{border-color:#bdbdbd}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 13px;margin-top:-44px;position:relative;height:36px}#status{font-size:11px;color:#929292;max-width:80%;line-height:1.4}#send{font-size:0;border-radius:50%;width:32px;height:32px;padding:0;background:#202020;color:white;flex-shrink:0}#send:after{content:'↑';font-size:23px;line-height:1}footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(800px,100%);text-align:center;background:#fff;font-size:10px;color:#999;padding:5px 14px;line-height:1.5}.composer{bottom:35px}button:focus-visible{outline:2px solid #555;outline-offset:3px}details{text-align:left;display:inline-block}summary{cursor:pointer;text-align:center}details[open]{background:white;border:1px solid #eee;padding:12px;border-radius:10px}@media(max-width:600px){main{padding:0 18px}header{padding:0 18px;height:62px}header small{display:none}h1{font-size:25px}.intro{padding-top:24vh}.composer{padding-left:12px;padding-right:12px}.user{max-width:88%}#messages{padding-top:90px}.intro p{font-size:13px}}
</style>
<main><header><div><span class="brand">心港</span><br><small>AI 陪伴</small></div><button id="clear">新对话</button></header>
<section class="intro"><small>给自己留一点空间</small><h1>今天，想聊点什么？</h1><p>随便说说，或者从一件小事开始。</p><div class="modes" aria-label="聊天偏好"><button aria-pressed="true" data-mode="倾诉">我想倾诉</button><button aria-pressed="false" data-mode="梳理">帮我梳理</button><button aria-pressed="false" data-mode="想办法">一起想办法</button></div></section>
<div id="messages" role="log" aria-live="polite"></div><form id="form" class="composer"><label for="input">此刻，你想说些什么？</label><textarea id="input" maxlength="4000" placeholder="发消息给心港…" required></textarea><div class="actions"><span id="status" role="status">正在检查模型配置…</span><button id="send" disabled>发送 ↗</button></div></form><footer><details><summary>AI 回复可能有误 · 对话仅保留在当前页面 · 隐私说明</summary>你正在与 AI 对话，它可能理解有误，不能替代专业支持。本版对话仅留在当前页面内存，刷新即清除；发送的内容会交给你配置的模型服务处理。若处于立即危险中，请联系当地紧急服务和身边可信任的人。</details></footer></main>
<script>
let history=[],mode='倾诉',token='',busy=false;const el=id=>document.getElementById(id);function show(role,text){document.body.classList.add('chatting');const box=document.createElement('div');box.className='msg '+role;const label=document.createElement('div');label.className='label';label.textContent=role==='user'?'你':'心港 · AI';const content=document.createElement('div');content.textContent=text;box.append(label,content);el('messages').append(box);box.scrollIntoView({behavior:'smooth',block:'nearest'});return box;}function lock(v){busy=v;el('send').disabled=v||!token;el('clear').disabled=v;document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=v);el('input').disabled=v;}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});el('clear').onclick=()=>{history=[];document.body.classList.remove('chatting');el('messages').replaceChildren();el('status').textContent='新对话已开始';el('input').focus()};el('form').onsubmit=async e=>{e.preventDefault();if(busy||!token)return;let text=el('input').value.trim();if(!text)return;if(history.length>=60){el('status').textContent='本次已达 30 轮，请开启新对话';return;}show('user',text);el('input').value='';lock(true);el('status').textContent='正在回复…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Session-Token':token},body:JSON.stringify({messages:[...history,{role:'user',content:text}],mode})});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');history.push({role:'user',content:text},{role:'assistant',content:data.reply});show('assistant',data.reply);el('status').textContent='';}catch(err){el('messages').lastElementChild?.remove();el('input').value=text;el('status').textContent=err.message;}finally{lock(false);el('input').focus()}};fetch('/api/session').then(r=>r.json()).then(s=>{token=s.token;el('status').textContent=s.configured?'已就绪':'尚未配置模型，请先填写本地 .env 并重启后端';el('send').disabled=!s.configured}).catch(()=>el('status').textContent='后端连接失败，请通过本地服务器打开页面');
</script></html>
