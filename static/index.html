<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心港 · 对话</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202020;font:15px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,textarea{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit;padding:9px 15px;border-radius:10px}button:hover{background:#eee}button:disabled{opacity:.35;cursor:default}main{max-width:800px;margin:auto;padding:0 24px}header{position:fixed;top:0;left:0;right:0;z-index:2;height:72px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;background:#ffffffed;border-bottom:1px solid #f2f2f2;backdrop-filter:blur(12px)}.brand{font-weight:600;font-size:19px;letter-spacing:1px}header small{font-size:11px;color:#999;margin-left:10px}header br{display:none}#clear{border:1px solid #e5e5e5;font-size:13px}.intro{text-align:center;padding:clamp(120px,24vh,230px) 0 45px}.intro>small{display:none}h1{font-size:30px;letter-spacing:-1px;font-weight:500;line-height:1.5;margin:0 0 12px}.intro p{font-size:14px;color:#999;margin:0 0 30px}.modes{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.modes button{border:1px solid #e6e6e6;border-radius:22px;font-size:13px;color:#777;padding:6px 16px}.modes button[aria-pressed=true]{color:#222;background:#f3f3f3;border-color:#d8d8d8}#messages{padding:100px 0 230px;display:none}body.chatting #messages{display:block}body.chatting .intro{display:none}.msg{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 32px;line-height:1.95}.user{background:#f2f2f2;border-radius:22px;padding:12px 20px;max-width:80%;width:fit-content;margin-left:auto}.assistant{padding:8px 4px}.label{font-size:11px;font-weight:600;color:#999;margin-bottom:9px}.user .label{display:none}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(800px,100%);padding:16px 24px 12px;background:linear-gradient(transparent,#fff 10%)}.composer>label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}textarea{display:block;width:100%;resize:none;min-height:112px;max-height:220px;border:1px solid #e8e8e8;border-radius:24px;background:#f7f7f7;padding:18px 20px 48px;color:#222;outline:none}textarea::placeholder{color:#aaa}textarea:focus{border-color:#bdbdbd}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 13px;margin-top:-44px;position:relative;height:36px}#status{font-size:11px;color:#929292;max-width:80%;line-height:1.4}#send{font-size:0;border-radius:50%;width:32px;height:32px;padding:0;background:#202020;color:white;flex-shrink:0}#send:after{content:'↑';font-size:23px;line-height:1}footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(800px,100%);text-align:center;background:#fff;font-size:10px;color:#999;padding:5px 14px;line-height:1.5}.composer{bottom:35px}button:focus-visible{outline:2px solid #555;outline-offset:3px}details{text-align:left;display:inline-block}summary{cursor:pointer;text-align:center}details[open]{background:white;border:1px solid #eee;padding:12px;border-radius:10px}@media(max-width:600px){main{padding:0 18px}header{padding:0 18px;height:62px}header small{display:none}h1{font-size:25px}.intro{padding-top:24vh}.composer{padding-left:12px;padding-right:12px}.user{max-width:88%}#messages{padding-top:90px}.intro p{font-size:13px}}
dialog{border:1px solid #ddd;border-radius:20px;width:min(520px,94vw);padding:24px;max-height:85vh}dialog::backdrop{background:#0005}dialog label{display:block;margin:14px 0}dialog input:not([type=checkbox]),dialog select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font:inherit}dialog textarea{min-height:80px;padding:10px}dialog p{font-size:12px;color:#777}
</style>
<main><header><div><span class="brand">心港</span><br><small>AI 陪伴</small></div><div><button id="memory-open">记忆与偏好</button><button id="clear">新对话</button></div></header>
<section class="intro"><small>给自己留一点空间</small><h1>今天，想聊点什么？</h1><p>随便说说，或者从一件小事开始。</p><div class="modes" aria-label="聊天偏好"><button aria-pressed="true" data-mode="倾诉">我想倾诉</button><button aria-pressed="false" data-mode="梳理">帮我梳理</button><button aria-pressed="false" data-mode="想办法">一起想办法</button></div></section>
<div id="messages" role="log" aria-live="polite"></div><form id="form" class="composer"><label for="input">此刻，你想说些什么？</label><textarea id="input" maxlength="4000" placeholder="发消息给心港…" required></textarea><div class="actions"><span id="status" role="status">正在检查模型配置…</span><button id="send" disabled>发送 ↗</button></div></form><footer><details><summary>AI 回复可能有误 · 记忆可控 · 隐私说明</summary>你正在与 AI 对话，它可能理解有误，不能替代专业支持。默认对话仅在页面内存；主动开启保存后，会保存在此浏览器，可在“记忆与偏好”中清除；发送的内容会交给你配置的模型服务处理。若处于立即危险中，请联系当地紧急服务和身边可信任的人。</details></footer></main>
<dialog id="memory-dialog"><h2>记忆与偏好</h2><p>开启后，记忆和本次对话保存在此浏览器，发消息时记忆会一并交给模型。共用电脑请清除数据。本版由你主动填写，不自动提取经历。</p><label><input type="checkbox" id="remember"> 保存记忆与对话</label><label>怎么称呼你<input id="nickname" maxlength="80"></label><label>聊天方式<select id="style"><option>自然朋友：简短、少分析</option><option>温柔安静：细腻、不肉麻</option><option>轻松聊天：适度幽默</option></select></label><label>最近在烦什么／进展<textarea id="concerns" maxlength="1500"></textarea></label><label>希望她怎么回应<textarea id="preferences" maxlength="1000" placeholder="比如：别总追问，先听我说"></textarea></label><button id="save-memory">保存</button><button id="erase-memory">清除全部本机数据</button><button id="close-memory">关闭</button><p id="memory-status" role="status"></p></dialog><script>
let profile={},remember=false;const storageKey='mind-harbor-v1';
let history=[],mode='倾诉',token='',busy=false;const el=id=>document.getElementById(id);function show(role,text){document.body.classList.add('chatting');const box=document.createElement('div');box.className='msg '+role;const label=document.createElement('div');label.className='label';label.textContent=role==='user'?'你':'心港 · AI';const content=document.createElement('div');content.textContent=text;box.append(label,content);el('messages').append(box);box.scrollIntoView({behavior:'smooth',block:'nearest'});return box;}function persist(){try{if(remember)localStorage.setItem(storageKey,JSON.stringify({profile,history}));else localStorage.removeItem(storageKey);}catch{el('status').textContent='本机保存失败，本次仍可聊天';}}
function lock(v){busy=v;el('memory-open').disabled=v;el('send').disabled=v||!token;el('clear').disabled=v;document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=v);el('input').disabled=v;}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});el('clear').onclick=()=>{history=[];persist();document.body.classList.remove('chatting');el('messages').replaceChildren();el('status').textContent='新对话已开始';el('input').focus()};el('form').onsubmit=async e=>{e.preventDefault();if(busy||!token)return;let text=el('input').value.trim();if(!text)return;if(history.length>=60){el('status').textContent='本次已达 30 轮，请开启新对话';return;}show('user',text);el('input').value='';lock(true);el('status').textContent='正在回复…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Session-Token':token},body:JSON.stringify({messages:[...history,{role:'user',content:text}],mode,memory:remember?profile:{}})});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');history.push({role:'user',content:text},{role:'assistant',content:data.reply});show('assistant',data.reply);persist();el('status').textContent='';}catch(err){el('messages').lastElementChild?.remove();el('input').value=text;el('status').textContent=err.message;}finally{lock(false);el('input').focus()}};try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&Array.isArray(saved.history)&&saved.history.length<=60){remember=true;profile=saved.profile||{};history=saved.history.filter(m=>['user','assistant'].includes(m.role)&&typeof m.content==='string');history.forEach(m=>show(m.role,m.content));}}catch{}
el('memory-open').onclick=()=>{el('remember').checked=remember;for(const k of ['nickname','concerns','preferences'])el(k).value=profile[k]||'';el('style').value=profile.style||'自然朋友：简短、少分析';el('memory-status').textContent='';el('memory-dialog').showModal();};
el('close-memory').onclick=()=>el('memory-dialog').close();
el('save-memory').onclick=()=>{remember=el('remember').checked;profile={};for(const k of ['nickname','concerns','preferences','style'])profile[k]=el(k).value.trim();persist();el('memory-status').textContent=remember?'已保存，下条消息开始使用。':'已关闭记忆并删除本机保存，当前对话仍可继续。';};
el('erase-memory').onclick=()=>{remember=false;profile={};history=[];persist();el('messages').replaceChildren();document.body.classList.remove('chatting');el('remember').checked=false;for(const k of ['nickname','concerns','preferences'])el(k).value='';el('memory-status').textContent='已清除本机记忆与对话，不影响模型服务商的数据。';};
fetch('/api/session').then(r=>r.json()).then(s=>{token=s.token;el('status').textContent=s.configured?'已就绪':'尚未配置模型，请先填写本地 .env 并重启后端';el('send').disabled=!s.configured}).catch(()=>el('status').textContent='后端连接失败，请通过本地服务器打开页面');
</script></html>
