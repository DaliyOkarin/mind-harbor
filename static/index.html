<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心港 · 慢慢说，我在听</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#283e38;font:16px/1.8 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:28px 22px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce2da;padding-bottom:18px}.brand{font-size:23px;font-weight:700;letter-spacing:3px}small{color:#6d7d74}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd7ce;background:#fffdf8;color:#38564a;border-radius:24px;padding:8px 18px}button:disabled{opacity:.5;cursor:wait}button[aria-pressed=true],#send{background:#355f50;color:white}.intro{text-align:center;padding:40px 0 24px}h1{font:500 32px/1.5 system-ui;margin:8px}.intro p{color:#738078;margin:8px}.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}#messages{min-height:180px;padding:20px 0}.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:15px 19px;margin:14px 0;max-width:90%;border-radius:18px;background:white}.user{margin-left:auto;background:#dfebe3}.label{font-size:12px;color:#77897e;margin-bottom:5px}.composer{position:sticky;bottom:0;padding:15px 0;background:#f6f4ee}textarea{display:block;width:100%;resize:vertical;min-height:95px;max-height:220px;border:1px solid #becdc1;border-radius:18px;background:#fffdf8;padding:16px;color:#283e38}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}#status{font-size:13px;color:#64776a}footer{font-size:12px;color:#7d887e;margin:16px 0}button:focus-visible,textarea:focus-visible{outline:3px solid #90b9a5;outline-offset:3px}@media(max-width:550px){main{padding:18px 14px}h1{font-size:27px}.intro{padding-top:25px}.msg{max-width:96%}}
</style>
<main><header><div><span class="brand">◌ 心港</span><br><small>AI 情绪陪伴 · 本地试用版</small></div><button id="clear">新对话</button></header>
<section class="intro"><small>给自己留一点空间</small><h1>慢慢说，不必整理好情绪。</h1><p>从今天发生的一件小事开始，也可以。</p><div class="modes" aria-label="聊天偏好"><button aria-pressed="true" data-mode="倾诉">我想倾诉</button><button aria-pressed="false" data-mode="梳理">帮我梳理</button><button aria-pressed="false" data-mode="想办法">一起想办法</button></div></section>
<div id="messages" role="log" aria-live="polite"></div><form id="form" class="composer"><label for="input">此刻，你想说些什么？</label><textarea id="input" maxlength="4000" placeholder="最近让我有些累的是……" required></textarea><div class="actions"><span id="status" role="status">正在检查模型配置…</span><button id="send" disabled>发送 ↗</button></div></form><footer>你正在与 AI 对话，它可能理解有误，不能替代专业支持。本版对话仅留在当前页面内存，刷新即清除；发送的内容会交给你配置的模型服务处理。若处于立即危险中，请联系当地紧急服务和身边可信任的人。</footer></main>
<script>
let history=[],mode='倾诉',token='',busy=false;const el=id=>document.getElementById(id);function show(role,text){const box=document.createElement('div');box.className='msg '+role;const label=document.createElement('div');label.className='label';label.textContent=role==='user'?'你':'心港 · AI';const content=document.createElement('div');content.textContent=text;box.append(label,content);el('messages').append(box);box.scrollIntoView({behavior:'smooth',block:'nearest'});return box;}function lock(v){busy=v;el('send').disabled=v||!token;el('clear').disabled=v;document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=v);el('input').disabled=v;}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});el('clear').onclick=()=>{history=[];el('messages').replaceChildren();el('status').textContent='新对话已开始';el('input').focus()};el('form').onsubmit=async e=>{e.preventDefault();if(busy||!token)return;let text=el('input').value.trim();if(!text)return;if(history.length>=60){el('status').textContent='本次已达 30 轮，请开启新对话';return;}show('user',text);el('input').value='';lock(true);el('status').textContent='心港正在认真读你的话…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Session-Token':token},body:JSON.stringify({messages:[...history,{role:'user',content:text}],mode})});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');history.push({role:'user',content:text},{role:'assistant',content:data.reply});show('assistant',data.reply);el('status').textContent='可以继续慢慢说';}catch(err){el('messages').lastElementChild?.remove();el('input').value=text;el('status').textContent=err.message;}finally{lock(false);el('input').focus()}};fetch('/api/session').then(r=>r.json()).then(s=>{token=s.token;el('status').textContent=s.configured?'已连接本地后端 · 可以开始聊天':'尚未配置模型，请先填写本地 .env 并重启后端';el('send').disabled=!s.configured}).catch(()=>el('status').textContent='后端连接失败，请通过本地服务器打开页面');
</script></html>
